<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柑橘音乐 | 入社笔试登记</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --bg: #fbfbfd;
            --accent: #ff6600;
            --text: #1d1d1f;
            --border: rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            /* 延续主页的网格纹理 */
            background-image: radial-gradient(var(--border) 1px, transparent 0);
            background-size: 40px 40px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            text-align: center;
        }

        h2 { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; color: var(--text); }
        .subtitle { color: #86868b; font-size: 14px; margin-bottom: 30px; }

        input, select {
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            background: #f5f5f7;
            border-radius: 14px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus, select:focus { border-color: var(--accent); background: white; }

        button {
            width: 100%;
            padding: 16px;
            background: var(--text);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: var(--accent); transform: translateY(-2px); }
        button:disabled { background: #d2d2d7; cursor: not-allowed; transform: none; }

        .footer-text { margin-top: 25px; font-size: 12px; color: #86868b; }
    </style>
</head>
<body>

<div class="container">
    <h2>Entrance Exam</h2>
    <p class="subtitle">Tangerine Music Club | Spring 2026</p>

    <form id="registrationForm">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="text" name="grade" placeholder="Grade / Major" required>
        <input type="email" name="email" placeholder="Applicant Email" required>

        <select name="department" required>
            <option value="" disabled selected>Select Primary Test Time</option>
            <option value="03/15/2026">03/15/2026 (Sun)</option>
            <option value="03/18/2026">03/18/2026 (Wed)</option>
        </select>

        <button type="submit" id="submitBtn">Submit Registration</button>
    </form>

    <p class="footer-text">© 2026 Tangerine Music Club. 保持热爱。</p>
</div>

<script>
    (function() {
        emailjs.init("10hWpZipaYA13RA3p");
    })();

    document.getElementById('registrationForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const btn = document.getElementById('submitBtn');
        const formData = new FormData(this);
        
        btn.disabled = true;
        btn.innerText = "Processing...";

        try {
            // 1. 发送 EmailJS (Admin)
            await emailjs.sendForm('service_gp5w7pv', 'template_300kjc8', this);
            console.log('Admin notified');

            // 2. 发送 EmailJS (Applicant)
            await emailjs.sendForm('service_gp5w7pv', 'template_lchb6gi', this);
            console.log('Applicant notified');

            // 3. 同时备份到 SheetDB (可选，强烈建议)
            // 你可以把这段代码解封，填入你的 API
            /*
            await fetch('https://sheetdb.io/api/v1/4x2oeeuemtkwp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    data: [ Object.fromEntries(formData) ]
                })
            });
            */

            // 4. 跳转
            // 如果你没有 success.html，可以临时改为 alert("报名成功！");
            window.location.href = "success.html"; 

        } catch (error) {
            console.error('Submission failed', error);
            alert("提交失败，请检查网络后再试！");
            btn.disabled = false;
            btn.innerText = "Submit Registration";
        }
    });
</script>

</body>
</html>
